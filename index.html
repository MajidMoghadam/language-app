<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multilingual Language Learner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">
    <div class="sentence-block" data-lang="en">
        <p class="sentence" dir="ltr">Hello, the weather is very nice today.</p>
    </div>

    <div class="sentence-block" data-lang="fr">
        <p class="sentence" dir="ltr">Bonjour, le temps est très agréable aujourd'hui.</p>
    </div>

    <div class="sentence-block" data-lang="ar">
        <p class="sentence" dir="rtl">مرحبًا، الطقس جميل جدًا اليوم.</p>
    </div>

    <div class="sentence-block" data-lang="fa">
        <p class="sentence" dir="rtl">سلام، هوا امروز بسیار خوب است.</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
