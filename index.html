<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilingual Text-to-Speech</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.responsivevoice.org/responsivevoice.js?key=iE3dlHHe"></script>
</head>
<body>
  <div id="content">
    <div class="language">
      <p class="text" data-lang="en">Hello, how are you today?</p>
    </div>
    <div class="language">
      <p class="text" data-lang="fr">Bonjour, comment ça va aujourd'hui?</p>
    </div>
    <div class="language">
      <p class="text" data-lang="ar">مرحباً، كيف حالك اليوم؟</p>
    </div>
    <div class="language">
      <p class="text" data-lang="fa">سلام، امروز حالتان چطور است؟</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
