<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multilingual Voice App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div class="container">
    <p lang="en">This is a test sentence in English.</p>
    <p lang="fr">Ceci est une phrase de test en français.</p>
    <p lang="ar" dir="rtl">هذه جملة اختبار باللغة العربية.</p>
    <p lang="fa" dir="rtl">این یک جمله تستی به زبان فارسی است.</p>
  </div>

  <script src="script.js"></script>

  <!-- ✅ Register the Service Worker for PWA support -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('✅ Service Worker Registered'))
        .catch(error => console.error('Service Worker registration failed:', error));
    }
  </script>
</body>
</html>
